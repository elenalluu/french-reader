<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Reader</title>
  <style>
    /* ── Reset & Base ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f7ff;
      --text:        #1a1a2e;
      --muted:       #5a6a8a;
      --accent:      #002395;
      --hover-line:  #b22222;
      --active-bg:   #dce8ff;
      --popup-bg:    #ffffff;
      --popup-bdr:   #002395;
      --link:        #001a70;
      --rule:        #b4c4e8;
      --nav-bg:      #eef1ff;
    }

    html { font-size: 18px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.85;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #site-header {
      background: var(--nav-bg);
      border-bottom: 1px solid var(--rule);
      padding: 1.5rem 2rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    #site-header h1 {
      font-size: 1.15rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    #site-header .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    #new-doc-btn {
      background: none;
      border: 1px solid var(--rule);
      border-radius: 3px;
      color: var(--link);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.2rem 0.65rem;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
      display: none;
    }

    #new-doc-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    #chapter-nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.7rem;
    }

    #chapter-nav button {
      background: none;
      border: 1px solid var(--rule);
      border-radius: 3px;
      color: var(--link);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.15rem 0.55rem;
      transition: background 0.15s, border-color 0.15s;
    }

    #chapter-nav button:hover,
    #chapter-nav button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Upload Zone ─────────────────────────────────────────── */
    #upload-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 3rem 2rem;
      text-align: center;
    }

    #drop-area {
      border: 2px dashed var(--rule);
      border-radius: 10px;
      padding: 4rem 3rem;
      max-width: 480px;
      width: 100%;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    #drop-area:hover,
    #drop-area.drag-over {
      border-color: var(--accent);
      background: rgba(0, 35, 149, 0.04);
    }

    #drop-area.drag-over {
      background: rgba(0, 35, 149, 0.08);
    }

    #drop-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    #drop-label {
      font-size: 1.05rem;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    #drop-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    #file-input { display: none; }

    #browse-btn {
      background: none;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.4rem 1.2rem;
      transition: background 0.15s, color 0.15s;
    }

    #browse-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    #upload-error {
      margin-top: 1rem;
      color: #8b0000;
      font-size: 0.82rem;
      font-style: italic;
      min-height: 1.2em;
    }

    /* ── Text Input ──────────────────────────────────────────── */
    .or-divider {
      color: var(--muted);
      font-size: 0.82rem;
      margin: 1.5rem 0 1rem;
    }

    /* ── Text Panel ──────────────────────────────────────────── */
    #text-panel {
      max-width: 480px;
      width: 100%;
      text-align: left;
    }

    #text-input {
      width: 100%;
      min-height: 120px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.9rem;
      line-height: 1.6;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      resize: vertical;
      transition: border-color 0.15s;
    }

    #text-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    #read-text-btn {
      margin-top: 0.75rem;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.4rem 1.2rem;
      transition: opacity 0.15s;
    }

    #read-text-btn:hover { opacity: 0.85; }

    #text-body { outline: none; }

    /* ── Main Content ────────────────────────────────────────── */
    #content {
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem;
      display: none;
    }

    .chapter {
      margin-bottom: 3.5rem;
    }

    .chapter-title {
      font-size: 1rem;
      font-variant: small-caps;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 1.2rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--rule);
    }

    p {
      margin-bottom: 1.1em;
      text-indent: 1.5em;
    }

    p:first-of-type { text-indent: 0; }

    /* ── Page Break Separators ───────────────────────────────── */
    .page-break {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.5rem 0;
      color: #666;
      font-size: 0.8rem;
    }

    .page-break hr {
      flex: 1;
      border: none;
      border-top: 1px solid #ccc;
    }

    /* ── Clickable Words ─────────────────────────────────────── */

    /* ── Tooltip Popup ───────────────────────────────────────── */
    #popup {
      position: absolute;
      z-index: 1000;
      width: 540px;
      max-width: calc(100vw - 24px);
      background: var(--popup-bg);
      border: 6px solid var(--popup-bdr);
      border-radius: 5px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      display: none;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    #popup.visible { display: block; }

    #popup.dragging {
      cursor: grabbing;
      user-select: none;
    }

    #popup.resizing {
      user-select: none;
    }

    #popup-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.55rem 0.75rem 0.4rem;
      border-bottom: 1px solid var(--rule);
      gap: 0.5rem;
    }

    #popup-lemma {
      font-weight: bold;
      color: var(--text);
      font-size: 0.95rem;
    }

    #popup-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 0 0 0.4rem;
      flex-shrink: 0;
    }

    #popup-close:hover { color: var(--text); }

    #popup-frame {
      display: block;
      width: 100%;
      height: 440px;
      border: none;
      border-top: 1px solid var(--rule);
    }

    /* ── Footer ──────────────────────────────────────────────── */
    #popup-footer {
      display: flex;
      gap: 0.5rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.78rem;
    }

    #popup-footer a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
    }

    #popup-footer a:hover { border-bottom-color: var(--accent); }

    /* ── Error Banner ────────────────────────────────────────── */
    #error-banner {
      background: #fff0f0;
      border: 1px solid #e8a0a0;
      border-radius: 4px;
      color: #8b0000;
      display: none;
      font-size: 0.85rem;
      margin: 1rem auto;
      max-width: 720px;
      padding: 0.8rem 1rem;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 480px) {
      html { font-size: 16px; }
      #content { padding: 1.5rem 1rem 4rem; }
      #popup { width: calc(100vw - 24px); }
      #drop-area { padding: 2.5rem 1.5rem; }
    }

    /* ── Print ───────────────────────────────────────────────── */
    @media print {
      #site-header, #popup, #upload-zone { display: none !important; }
      #content { display: block !important; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header id="site-header">
  <div id="header-top">
    <h1 id="doc-title">French Reader</h1>
    <button id="new-doc-btn">New document</button>
  </div>
  <div class="meta" id="doc-meta">Drop a document here &bull; Click any word for the dictionary</div>
  <nav id="chapter-nav" aria-label="Sections"></nav>
</header>

<!-- ── Error Banner ── -->
<div id="error-banner"></div>

<!-- ── Upload Zone ── -->
<div id="upload-zone">
  <div id="drop-area" role="button" tabindex="0" aria-label="Drop zone for PDF or .docx files">
    <div id="drop-icon">&#128196;</div>
    <div id="drop-label">Drop a French document here</div>
    <div id="drop-sub">.pdf, .docx, or .epub</div>
    <button id="browse-btn" type="button">Browse&hellip;</button>
    <input id="file-input" type="file" accept=".pdf,.docx,.epub,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/epub+zip">
    <div id="upload-error" aria-live="polite"></div>
  </div>
  <div id="text-panel">
    <div class="or-divider">— or —</div>
    <textarea id="text-input" placeholder="Paste or type French text here…" rows="6"></textarea>
    <button id="read-text-btn" type="button">Read text</button>
  </div>
</div>

<!-- ── Main Text ── -->
<main id="content">
  <div id="text-body" contenteditable="true" spellcheck="false"></div>
</main>

<!-- ── Popup Tooltip ── -->
<div id="popup" role="dialog" aria-label="Wiktionary">
  <div id="popup-header">
    <span id="popup-lemma"></span>
    <button id="popup-close" aria-label="Close">&times;</button>
  </div>
  <iframe id="popup-frame"
          sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
          title="Wiktionary entry"></iframe>
  <div id="popup-footer">
    <a id="popup-wikt-link" href="#" target="_blank" rel="noopener">en.wiktionary &#8599;</a>
  </div>
</div>

<!-- ── External Scripts ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"
        onerror="window._mammothError=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- ── Application Logic ── -->
<script>
(function () {
  'use strict';

  function normalize(w) {
    return w.toLowerCase(); // preserve accents for Wiktionary lookups
  }

  // ── Structure Extraction (for .docx) ──────────────────────────────────────

  function extractStructure(html, filename) {
    const div = document.createElement('div');
    div.innerHTML = html;

    const chapters = [];
    let current = null;
    let chapterIdx = 0;

    const docTitle = filename.replace(/\.(docx|pdf)$/i, '').replace(/[_-]/g, ' ');

    function flushPara(text) {
      const t = text.trim();
      if (!t) return;
      if (!current) {
        current = { id: 'section' + (++chapterIdx), title: docTitle, paragraphs: [] };
        chapters.push(current);
      }
      current.paragraphs.push(t);
    }

    for (const child of div.children) {
      const tag = child.tagName.toLowerCase();
      if (tag === 'h1' || tag === 'h2' || tag === 'h3') {
        current = { id: 'section' + (++chapterIdx), title: child.textContent.trim() || 'Section ' + chapterIdx, paragraphs: [] };
        chapters.push(current);
      } else if (tag === 'p' || tag === 'li') {
        flushPara(child.textContent);
      } else {
        for (const sub of child.children) {
          flushPara(sub.textContent);
        }
      }
    }

    if (chapters.length === 0) {
      chapters.push({ id: 'section1', title: docTitle, paragraphs: [div.textContent.trim()] });
    }

    const filled = chapters.filter(ch => ch.paragraphs.length > 0);
    return {
      title: filled[0] ? (chapters[0].title || docTitle) : docTitle,
      chapters: filled.length > 0 ? filled : chapters
    };
  }

  // ── PDF.js Support ─────────────────────────────────────────────────────────

  let pdfjsLib = null;

  async function ensurePdfjs() {
    if (pdfjsLib) return true;
    try {
      pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs');
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
      return true;
    } catch {
      return false;
    }
  }

  function reconstructParagraphs(items) {
    if (!items || items.length === 0) return [];

    // Group text items by Y coordinate (bucket to 3px)
    const lineMap = new Map();
    for (const item of items) {
      if (!item.str || !item.str.trim()) continue;
      const y = Math.round(item.transform[5] / 3) * 3;
      if (!lineMap.has(y)) lineMap.set(y, []);
      lineMap.get(y).push({ x: item.transform[4], str: item.str });
    }

    // Sort lines top→bottom (higher Y = higher on page in PDF coords)
    const sortedYs = [...lineMap.keys()].sort((a, b) => b - a);

    const lines = sortedYs.map(y => {
      const rowItems = lineMap.get(y).sort((a, b) => a.x - b.x);
      return rowItems.map(i => i.str).join(' ').trim();
    }).filter(l => l.length > 0);

    // Group lines into paragraphs (blank line = new paragraph)
    const paragraphs = [];
    let current = [];
    for (const line of lines) {
      if (line === '') {
        if (current.length > 0) {
          paragraphs.push(current.join(' '));
          current = [];
        }
      } else {
        current.push(line);
      }
    }
    if (current.length > 0) paragraphs.push(current.join(' '));

    return paragraphs.filter(p => p.length >= 10);
  }

  async function loadPdf(file) {
    uploadError.textContent = '';
    errorBanner.style.display = 'none';

    const loaded = await ensurePdfjs();
    if (!loaded) {
      uploadError.textContent = 'Could not load the PDF parser. Check your internet connection.';
      return;
    }

    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const numPages = pdf.numPages;

      const docTitle = file.name.replace(/\.pdf$/i, '').replace(/[_-]/g, ' ');

      // Build a single section with inline page-break markers
      // We'll render page breaks directly into the DOM
      textBody.innerHTML = '';
      chapterNav.innerHTML = '';

      let totalParas = 0;
      const container = document.createDocumentFragment();

      for (let i = 1; i <= numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        const paragraphs = reconstructParagraphs(tc.items);
        totalParas += paragraphs.length;

        paragraphs.forEach(paraText => {
          const p = document.createElement('p');
          p.textContent = paraText;
          container.appendChild(p);
        });

        // Insert page separator after each page except the last
        if (i < numPages) {
          const sep = document.createElement('div');
          sep.className = 'page-break';
          sep.innerHTML = '<hr><span>\u2014 Page ' + i + ' \u2014</span><hr>';
          container.appendChild(sep);
        }
      }

      if (totalParas === 0) {
        errorBanner.textContent = 'This PDF contains no extractable text. It may be a scanned image.';
        errorBanner.style.display = 'block';
        return;
      }

      textBody.appendChild(container);

      uploadZone.style.display = 'none';
      content.style.display = 'block';
      docTitleEl.textContent = docTitle;
      docMeta.textContent = 'Double-click any word for its definition \u2022 Wiktionary (French)';
      newDocBtn.style.display = 'inline-block';
      chapterNav.style.display = 'none';

    } catch (err) {
      uploadError.textContent = 'Error reading PDF: ' + (err.message || err);
    }
  }

  // ── DOCX Loading ───────────────────────────────────────────────────────────

  async function loadDocx(file) {
    uploadError.textContent = '';
    errorBanner.style.display = 'none';

    if (window._mammothError || typeof mammoth === 'undefined') {
      uploadError.textContent = 'Could not load mammoth.js (CDN unavailable). Check your internet connection.';
      return;
    }

    try {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer });
      const textData = extractStructure(result.value, file.name);
      textInput.value = (textData.chapters || []).flatMap(ch => ch.paragraphs || []).join('\n\n');
      buildDOM(textData);
    } catch (err) {
      uploadError.textContent = 'Error reading document: ' + (err.message || err);
    }
  }

  // ── EPUB Loader ────────────────────────────────────────────────────────────

  function flattenEpubBody(body) {
    const parts = [];
    function walk(node) {
      if (node.nodeType !== 1) return;
      const tag = node.tagName.toLowerCase();
      if (tag === 'h1' || tag === 'h2' || tag === 'h3') {
        parts.push('<' + tag + '>' + node.textContent + '</' + tag + '>');
      } else if (tag === 'p' || tag === 'li') {
        const t = node.textContent.trim();
        if (t) parts.push('<p>' + t + '</p>');
      } else {
        for (const child of node.children) walk(child);
      }
    }
    for (const child of body.children) walk(child);
    return parts.join('');
  }

  async function loadEpub(file) {
    const zip = await JSZip.loadAsync(await file.arrayBuffer());

    // Find the OPF file path from container.xml
    const containerXml = await zip.file('META-INF/container.xml').async('text');
    const parser = new DOMParser();
    const container = parser.parseFromString(containerXml, 'application/xml');
    const opfPath = container.querySelector('rootfile').getAttribute('full-path');
    const opfDir = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';

    // Parse OPF to get spine order
    const opfXml = await zip.file(opfPath).async('text');
    const opf = parser.parseFromString(opfXml, 'application/xml');
    const manifestItems = {};
    opf.querySelectorAll('manifest item').forEach(item => {
      manifestItems[item.getAttribute('id')] = item.getAttribute('href');
    });
    const spineIds = [...opf.querySelectorAll('spine itemref')].map(r => r.getAttribute('idref'));

    // Extract structure from each spine item
    const allChapters = [];
    let chapterOffset = 0;
    for (const id of spineIds) {
      const href = manifestItems[id];
      if (!href) continue;
      const fullPath = opfDir + href;
      const entry = zip.file(fullPath) || zip.file(decodeURIComponent(fullPath));
      if (!entry) continue;
      const html = await entry.async('text');
      const doc = parser.parseFromString(html, 'text/html');
      const result = extractStructure(flattenEpubBody(doc.body), file.name);
      for (const ch of result.chapters) {
        ch.id = 'section' + (++chapterOffset);
        allChapters.push(ch);
      }
    }

    const title = file.name.replace(/\.epub$/i, '').replace(/[_-]/g, ' ');
    return { title, chapters: allChapters };
  }

  // ── File Router ────────────────────────────────────────────────────────────

  async function handleFile(file) {
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      uploadError.textContent = 'File too large (maximum 50 MB).';
      return;
    }
    if (file.name.match(/\.pdf$/i) || file.type === 'application/pdf') {
      await loadPdf(file);
    } else if (file.name.match(/\.docx$/i)) {
      await loadDocx(file);
    } else if (file.name.match(/\.epub$/i) || file.type === 'application/epub+zip') {
      try {
        const epubData = await loadEpub(file);
        textInput.value = (epubData.chapters || []).flatMap(ch => ch.paragraphs || []).join('\n\n');
        buildDOM(epubData);
      } catch (err) {
        uploadError.textContent = 'Error reading EPUB: ' + (err.message || err);
      }
    } else {
      uploadError.textContent = 'Unsupported file type. Please upload a .pdf, .docx, or .epub file.';
    }
  }

  // ── DOM Elements ───────────────────────────────────────────────────────────

  const uploadZone  = document.getElementById('upload-zone');
  const content     = document.getElementById('content');
  const textBody    = document.getElementById('text-body');
  const chapterNav  = document.getElementById('chapter-nav');
  const docTitleEl  = document.getElementById('doc-title');
  const docMeta     = document.getElementById('doc-meta');
  const newDocBtn   = document.getElementById('new-doc-btn');
  const dropArea    = document.getElementById('drop-area');
  const fileInput   = document.getElementById('file-input');
  const browseBtn   = document.getElementById('browse-btn');
  const uploadError = document.getElementById('upload-error');
  const errorBanner = document.getElementById('error-banner');
  const readTextBtn = document.getElementById('read-text-btn');
  const textInput   = document.getElementById('text-input');

  // ── DOM Building ───────────────────────────────────────────────────────────

  function buildDOM(textData) {
    textBody.innerHTML = '';
    chapterNav.innerHTML = '';

    const chapters = textData.chapters || [];

    chapters.forEach(chapter => {
      const btn = document.createElement('button');
      btn.textContent = chapter.title;
      btn.dataset.chapterId = chapter.id;
      btn.addEventListener('click', () => {
        document.getElementById('ch-' + chapter.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      chapterNav.appendChild(btn);

      const section = document.createElement('section');
      section.className = 'chapter';
      section.id = 'ch-' + chapter.id;

      const heading = document.createElement('h2');
      heading.className = 'chapter-title';
      heading.textContent = chapter.title;
      section.appendChild(heading);

      (chapter.paragraphs || []).forEach(paraText => {
        const p = document.createElement('p');
        p.textContent = paraText;
        section.appendChild(p);
      });

      textBody.appendChild(section);
    });

    setupScrollSpy(chapters);

    uploadZone.style.display = 'none';
    content.style.display = 'block';
    docTitleEl.textContent = textData.title || 'French document';
    docMeta.textContent = 'Double-click any word for its definition \u2022 Wiktionary (French)';
    newDocBtn.style.display = 'inline-block';
    chapterNav.style.display = chapters.length <= 1 ? 'none' : '';
  }

  // ── Scroll Spy ─────────────────────────────────────────────────────────────

  function setupScrollSpy(chapters) {
    if (!('IntersectionObserver' in window)) return;

    const navBtns = {};
    chapterNav.querySelectorAll('button').forEach(btn => {
      navBtns[btn.dataset.chapterId] = btn;
    });

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id.replace('ch-', '');
          Object.values(navBtns).forEach(b => b.classList.remove('active'));
          if (navBtns[id]) navBtns[id].classList.add('active');
        }
      });
    }, { threshold: 0.15, rootMargin: '-80px 0px 0px 0px' });

    chapters.forEach(ch => {
      const el = document.getElementById('ch-' + ch.id);
      if (el) observer.observe(el);
    });
  }

  // ── Popup ──────────────────────────────────────────────────────────────────

  const popup    = document.getElementById('popup');
  const popLemma = document.getElementById('popup-lemma');
  const popFrame = document.getElementById('popup-frame');
  const popWikt  = document.getElementById('popup-wikt-link');
  const popClose = document.getElementById('popup-close');

  let activeRange = null;

  // ── Drag & Resize ─────────────────────────────────────────────────────────
  const DRAG_BORDER = 6;
  const CORNER_SIZE = 16;
  const MIN_W = 240, MIN_H = 180;

  const popHeader = document.getElementById('popup-header');
  const popFooter = document.getElementById('popup-footer');

  let dragging  = false, dragOffX = 0, dragOffY = 0;
  let resizing  = false, resizeCorner = '';
  let rsStartX  = 0, rsStartY = 0;
  let rsInitW   = 0, rsInitH = 0, rsInitLeft = 0, rsInitTop = 0;

  function getCorner(e, r) {
    const nearL = e.clientX - r.left  < CORNER_SIZE;
    const nearR = r.right  - e.clientX < CORNER_SIZE;
    const nearT = e.clientY - r.top   < CORNER_SIZE;
    const nearB = r.bottom - e.clientY < CORNER_SIZE;
    const onBdr = e.clientX - r.left  < DRAG_BORDER || r.right  - e.clientX < DRAG_BORDER ||
                  e.clientY - r.top   < DRAG_BORDER || r.bottom - e.clientY < DRAG_BORDER;
    if (!onBdr && !nearL && !nearR && !nearT && !nearB) return null;
    if (nearL && nearT) return 'nw';
    if (nearR && nearT) return 'ne';
    if (nearL && nearB) return 'sw';
    if (nearR && nearB) return 'se';
    if (onBdr) return 'edge';
    return null;
  }

  function applyIframeHeight(totalH) {
    const inner = totalH - popHeader.offsetHeight - popFooter.offsetHeight;
    popFrame.style.height = Math.max(60, inner) + 'px';
  }

  popup.addEventListener('mousemove', e => {
    if (dragging || resizing) return;
    const r = popup.getBoundingClientRect();
    const corner = getCorner(e, r);
    if (corner === 'nw' || corner === 'se') popup.style.cursor = 'nwse-resize';
    else if (corner === 'ne' || corner === 'sw') popup.style.cursor = 'nesw-resize';
    else if (corner === 'edge') popup.style.cursor = 'grab';
    else popup.style.cursor = 'default';
  });

  popup.addEventListener('mouseleave', () => {
    if (!dragging && !resizing) popup.style.cursor = '';
  });

  popup.addEventListener('mousedown', e => {
    const r = popup.getBoundingClientRect();
    const corner = getCorner(e, r);
    if (!corner) return;
    e.preventDefault();
    popFrame.style.pointerEvents = 'none';

    if (corner === 'edge') {
      dragging = true;
      dragOffX = e.clientX - r.left;
      dragOffY = e.clientY - r.top;
      popup.classList.add('dragging');
    } else {
      resizing     = true;
      resizeCorner = corner;
      rsStartX     = e.clientX;
      rsStartY     = e.clientY;
      rsInitW      = r.width;
      rsInitH      = r.height;
      rsInitLeft   = r.left + window.scrollX;
      rsInitTop    = r.top  + window.scrollY;
      popup.classList.add('resizing');
    }
  });

  document.addEventListener('mousemove', e => {
    if (dragging) {
      popup.style.left = (e.clientX - dragOffX + window.scrollX) + 'px';
      popup.style.top  = (e.clientY - dragOffY + window.scrollY) + 'px';
    } else if (resizing) {
      const dx = e.clientX - rsStartX;
      const dy = e.clientY - rsStartY;
      let w = rsInitW, h = rsInitH, l = rsInitLeft, t = rsInitTop;

      if (resizeCorner === 'se') { w += dx; h += dy; }
      if (resizeCorner === 'sw') { w -= dx; l += dx; h += dy; }
      if (resizeCorner === 'ne') { w += dx; h -= dy; t += dy; }
      if (resizeCorner === 'nw') { w -= dx; l += dx; h -= dy; t += dy; }

      w = Math.max(MIN_W, w);
      h = Math.max(MIN_H, h);
      popup.style.width  = w + 'px';
      popup.style.height = h + 'px';
      popup.style.left   = l + 'px';
      popup.style.top    = t + 'px';
      applyIframeHeight(h);
    }
  });

  document.addEventListener('mouseup', () => {
    if (!dragging && !resizing) return;
    dragging = false;
    resizing = false;
    popFrame.style.pointerEvents = '';
    popup.classList.remove('dragging', 'resizing');
    activeRange = null;  // prevent scroll/resize handlers from snapping popup back
  });

  function showPopup(rawWord, range) {
    activeRange = range;

    popLemma.textContent = rawWord;

    const enc = encodeURIComponent(normalize(rawWord));
    const wiktUrl = `https://en.wiktionary.org/wiki/${enc}#French`;

    popFrame.src = wiktUrl;
    popWikt.href = wiktUrl;

    popup.classList.add('visible');
    positionPopup(range);
  }

  function positionPopup(range) {
    const GAP = 12;
    const popH = popup.offsetHeight;
    const popW = popup.offsetWidth;
    popup.style.top  = (window.scrollY + window.innerHeight - popH - GAP) + 'px';
    popup.style.left = (window.scrollX + window.innerWidth  - popW - GAP) + 'px';
  }

  function hidePopup() {
    popup.classList.remove('visible');
    activeRange = null;
  }

  // ── Word Double-click Handler ──────────────────────────────────────────────

  textBody.addEventListener('dblclick', () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
    const rawWord = sel.toString().trim();
    if (!rawWord || !/[A-Za-z\u00C0-\u00FF]/.test(rawWord)) return;
    showPopup(rawWord, sel.getRangeAt(0));
  });

  document.addEventListener('click', e => {
    if (!popup.contains(e.target)) hidePopup();
  });

  popClose.addEventListener('click', hidePopup);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hidePopup();
  });

  window.addEventListener('scroll', () => {
    if (activeRange && popup.classList.contains('visible')) positionPopup(activeRange);
  }, { passive: true });

  window.addEventListener('resize', () => {
    if (activeRange && popup.classList.contains('visible')) positionPopup(activeRange);
  });

  // ── Direct Text Input ──────────────────────────────────────────────────────

  readTextBtn.addEventListener('click', () => {
    const raw = textInput.value.trim();
    if (!raw) return;
    const paragraphs = raw.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    buildDOM({
      title: 'Text',
      chapters: [{ title: '', id: 'ch0', paragraphs }]
    });
  });

  // ── Upload / Drop Handling ─────────────────────────────────────────────────

  browseBtn.addEventListener('click', () => fileInput.click());

  dropArea.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') fileInput.click();
  });

  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) handleFile(file);
    fileInput.value = '';
  });

  dropArea.addEventListener('dragover', e => {
    e.preventDefault();
    dropArea.classList.add('drag-over');
  });

  dropArea.addEventListener('dragleave', e => {
    if (!dropArea.contains(e.relatedTarget)) {
      dropArea.classList.remove('drag-over');
    }
  });

  dropArea.addEventListener('drop', e => {
    e.preventDefault();
    dropArea.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  // Allow dropping anywhere on the page when in upload state
  document.addEventListener('dragover', e => {
    if (uploadZone.style.display !== 'none') e.preventDefault();
  });

  document.addEventListener('drop', e => {
    if (uploadZone.style.display !== 'none') {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    }
  });

  // ── New Document Button ────────────────────────────────────────────────────

  newDocBtn.addEventListener('click', () => {
    hidePopup();
    textBody.innerHTML = '';
    chapterNav.innerHTML = '';
    content.style.display = 'none';
    uploadZone.style.display = '';
    errorBanner.style.display = 'none';
    docTitleEl.textContent = 'French Reader';
    docMeta.textContent = 'Drop a document here \u2022 Double-click any word for the dictionary';
    newDocBtn.style.display = 'none';
    uploadError.textContent = '';
    textInput.value = '';
  });

})();
</script>
</body>
</html>
